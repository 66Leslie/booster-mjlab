[project]
name = "mjlab-playground"
version = "0.1.0"
description = "Extra tasks for mjlab"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "mjlab[cu128]",
    "torch>=2.7.0,<2.10.0",
]

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
mjlab = { git = "https://github.com/mujocolab/mjlab", rev = "9298ba5691858dec9f0fa7c53c0ffb453192da67" }
warp-lang = { index = "nvidia", marker = "sys_platform != 'darwin'" }
torch = [
  { index = "pytorch-cu128", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
indent-width = 2
src = ["src/mjlab_playground"]
exclude = ["typings"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pyright]
pythonVersion = "3.13"
include = ["src"]
exclude = ["tests", "typings"]
ignore = ["./typings"]
stubPath = "typings"
reportWildcardImportFromLibrary = false

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "ruff>=0.14.14",
    "ty>=0.0.14",
]

[project.entry-points."mjlab.tasks"]
mjlab_playground = "mjlab_playground"
